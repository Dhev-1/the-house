[General]
# The knobs worth turning without editing qml. SDDM parses this file and hands
# it to the theme as `config`; values arrive as strings - except one holding a
# comma, which SDDM splits into a list first - so the qml compares booleans
# against "true" rather than trusting a type.
#
# Colours are not here - they live in Palette.js.

# The face on everything. The suit glyphs and the power icons want a Nerd Font.
fontFamily=JetBrainsMono Nerd Font

clock24h=true

# The house name above the clock. Empty uses the machine's hostname.
houseName=

# The shape of the bet: how tall each stack is allowed to get, left to right.
# The number of entries is the number of stacks, and the total is the longest
# password the felt can report - past it the password still takes characters,
# the felt just stops reporting them. Deliberately uneven.
stackHeights=10,4,9,7,5

# Deal the showdown hand on enter. Off makes login instant and silent.
showdown=true

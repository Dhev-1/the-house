[General]
# The knobs worth turning without editing qml. SDDM parses this file and hands
# it to the theme as `config`; every value arrives as a string, so the qml
# compares booleans against "true" rather than trusting a type.
#
# Colours are deliberately NOT here - they live in Palette.qml, where they can
# be named and commented. A login screen with fourteen hex codes in an ini file
# is a login screen nobody can retheme without a screenshot and a colour picker.

# The face on everything. Falls back to whatever fontconfig picks if absent -
# but the suit glyphs and the power icons want a Nerd Font.
fontFamily=JetBrainsMono Nerd Font

# 24-hour clock on the marquee.
clock24h=true

# The house name above the clock. Empty uses the machine's hostname.
houseName=

# How tall the bet is allowed to get before the stack starts compressing
# instead of growing. Past this, chips still land - they just tuck closer.
maxStack=14

# Deal the showdown hand on enter. Off makes login instant and silent, which is
# the sensible thing on a machine you log into forty times a day.
showdown=true

# AUTOGENERATED by cloon/newdot/house scripts/apply-theme.sh — do not edit by hand.
# Rewritten whenever a table is chosen in the house bar's picker; sourced from
# hyprland.conf so the choice sticks across a restart. The $-variables are here
# for reuse (e.g. from binds or window rules); the keywords below are what paint.

$surface = rgb(0e2b1c)
$text    = rgb(eae3cd)
$subtext = rgb(7fa08c)
$accent  = rgb(c9a227)
$idle    = rgb(1d4030)
$urgent  = rgb(c0392f)

# The rail. Flat accent on every table but vegas, which keeps the gradient.
general:border_size = 2
general:col.active_border = rgba(c9a227ee)
general:col.inactive_border = rgba(1d403055)

# The spotlight.
decoration:dim_strength = 0.22
decoration:shadow:color = rgba(c9a22733)
decoration:shadow:color_inactive = rgba(00000088)

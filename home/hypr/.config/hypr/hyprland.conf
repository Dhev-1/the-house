
# https://wiki.hypr.land/Configuring/

source = ~/.config/hypr/sidebar.conf
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = eval $(gnome-keyring-daemon --start --components=secrets)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-4,2560x1440@120.0,1920x0,1
#monitor=DP-4,2560x1440@59.95,0x0,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$terminal = kitty
$fileManager = thunar


#################
### AUTOSTART ###
#################

 exec-once = nm-applet
 exec-once = qs -p ~/cloon/newdot/house
 exec-once = awww-daemon
 exec-once = awww img ~/cloon/newdot/wallpapers/noir.png


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Qt apps have no reason to find the house on their own: this is what sends them
# to qt6ct, which holds the palette (and the style) that scripts/apply-theme.sh
# retints on every table change. The house's own shell overrides this for itself
# in shell.qml - it wants the portal theme, for native tray menus.
env = QT_QPA_PLATFORMTHEME,qt6ct

env = WLR_DRM_DEVICES,/dev/dri/card2
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    # Card stock: windows want to read as cards laid out on felt rather than
    # tiles butted up against each other, so the outer gap is wider than the
    # inner one - the wallpaper showing around the edge is the table.
    gaps_in = 6      # was 5
    gaps_out = 12    # was 5

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # A thin flat line of the accent. The focused window is meant to be picked
    # out by the glow underneath it (decoration:shadow, below) rather than by
    # the border - so this stays quiet. Vegas is the exception and swaps in a
    # gradient rail; that lives in colors.conf, which is sourced last and is
    # what actually paints. This is only the fallback for a checkout that has
    # never run the theme picker.
    col.active_border = rgba(d4af5fee)

    col.inactive_border  = rgba(2a232055)
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing =true 

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 13  # was 10; the corner radius of an actual playing card
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    # The spotlight. Only one table in the room is lit: the focused window keeps
    # its colour and everything else sinks into the floor. dim_strength is set
    # per table by colors.conf - the light table needs far less of it than the
    # dark ones, where 0.25 reads as dimmed and on cream reads as muddy.
    dim_inactive = true
    dim_strength = 0.25

    shadow {
        enabled = true
        # A wide, soft, accent-tinted bloom instead of a tight black drop: a
        # lamp hanging over the live table. Both colours come from colors.conf.
        range = 20        # was 4
        render_power = 3
        color = rgba(d4af5f33)
        color_inactive = rgba(00000088)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # The house curves. `deal` ends above 1, so a window overshoots a hair and
    # settles back - a card skimmed across the felt catching as it stops. `muck`
    # is the opposite shape: slow to let go, then snatched away.
    bezier = deal,           0.05, 0.9,  0.1,  1.04
    bezier = muck,           0.6,  0,    0.9,  0.2
    bezier = rail,           0,    0,    1,    1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint

    # The gradient angle sweeps one full turn as a window opens, then stops.
    # Deliberately not `loop`: looping repaints the border every frame for as
    # long as the window is up, which on this box means holding the GPU awake
    # forever for a sheen nobody is looking at. Once, on the deal, is the effect.
    animation = borderangle,   1,     30,    rail

    animation = windows,       1,     4.79,  easeOutQuint
    # Dealt in from the top - the same corner the bar and the dealer live in.
    animation = windowsIn,     1,     5,     deal,         slide top
    # Swept into the muck: holds still a beat, then is dragged off to the right.
    #
    # fadeOut below has to be at least this long or the effect is invisible. The
    # muck curve is back-loaded on purpose - all the travel is in the last
    # instant - so a shorter fade leaves the window fully transparent before it
    # goes anywhere, and all you see is a fade.
    animation = windowsOut,    1,     2.8,   muck,         slide right
    animation = fadeIn,        1,     1.73,  almostLinear
    # Matched to windowsOut, not left at the stock 1.46 - see the note there.
    animation = fadeOut,       1,     2.8,   almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    # The shoe advancing: workspaces slide rather than crossfade in place.
    animation = workspaces,    1,     3,     deal,         slidefade 15%
    animation = workspacesIn,  1,     3,     deal,         slidefade 15%
    animation = workspacesOut, 1,     2.4,   muck,         slidefade 15%
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
   # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# The groupbar (SUPER+G) is deliberately left stock. Styling it as a chip rack
# was tried and dropped: at any height that reads as a chip it competes with the
# bottom bar's pit for the same "row of chips" idea, and at a subtle height the
# fill disappears into a dark wallpaper and leaves floating text.

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vrr = 0
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    accel_profile = flat
    follow_mouse = 1 

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_warps = true
}
# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
source = $HOME/.config/hypr/binds.conf
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    # Ignore maximize requests from all apps.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = satty-float
    match:class = ^(com\.gabm\.satty)$

    float = on
    center = on
    size = 70% 70%
}

# Theme colours written by the house bar's theme picker (cloon/newdot/house
# scripts/apply-theme.sh). Sourced last so its general/decoration overrides win.
source = ~/.config/hypr/colors.conf

# hyprlock — the velvet rope. Structure lives here; the colours come from
# lock-colours.conf, regenerated by house/scripts/apply-theme.sh whenever a
# table is chosen, so the rope matches the active table.

source = ~/.config/hypr/lock-colours.conf

general {
    hide_cursor = true
}

background {
    color = $lockBackground
}

input-field {
    size = 300, 60
    rounding = 30
    outline_thickness = 2
    outer_color = $lockOuter

    inner_color = $lockInner
    font_color = $lockFont
    placeholder_text = $lockPlaceholder
    dots_center = true

    position = 0, 0
    halign = center
    valign = center

    capslock_color = $lockCaps
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"

    font_size = 40
    font_family = JetBrainsMono Nerd Font
    color = $lockClock

    position = -60, 60
    halign = right
    valign = top
}

label {
    text = ♠ ♥ ♦ ♣
    font_size = 18
    color = $lockSuits

    position = 0, -120
    halign = center
    valign = center
}

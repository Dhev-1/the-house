# hyprlock — the velvet rope. Noir table colours: black lacquer background,
# champagne-gold text, a felt-dark input chip.

general {
    hide_cursor = true
}

background {
    color = rgba(14, 11, 13, 1.0)
}

input-field {
    size = 300, 60
    rounding = 30
    outline_thickness = 2
    outer_color = rgba(212, 175, 95, 0.55)

    inner_color = rgba(30, 24, 19, 0.75)
    font_color = rgba(232, 221, 196, 1)
    placeholder_text = <span foreground="##8a7f6d">place your bets</span>
    dots_center = true

    position = 0, 0
    halign = center
    valign = center

    capslock_color = rgba(193, 58, 78, 1)
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"

    font_size = 40
    font_family = JetBrainsMono Nerd Font
    color = rgba(212, 175, 95, 1)

    position = -60, 60
    halign = right
    valign = top
}

label {
    text = ♠ ♥ ♦ ♣
    font_size = 18
    color = rgba(138, 127, 109, 1)

    position = 0, -120
    halign = center
    valign = center
}

# ~/.config/hypr/sidebar.conf
# Sidebar dock. The tab and all the docking logic live in the house shell
# (~/.config/quickshell/house); this file only wires Hyprland up to it.
#
# Docked windows are floating + pinned, so they sit on the left while you keep
# working in whatever is focused. No special workspace.

# Docked windows are parked here while hidden. Nothing should live here
# otherwise; it is never switched to.
workspace = name:sidebar, gapsout:0, gapsin:0

# --- Keybinds: one action each ---
bind = SUPER SHIFT, D, exec, qs -p ~/.config/quickshell/house ipc call sidebar dock     # dock focused window
bind = SUPER SHIFT, U, exec, qs -p ~/.config/quickshell/house ipc call sidebar undock   # undock focused window
bind = SUPER ALT, D, exec, qs -p ~/.config/quickshell/house ipc call sidebar toggle     # show/hide the dock
bind = SUPER, TAB, exec, qs -p ~/.config/quickshell/house ipc call sidebar cycle        # cycle docked windows

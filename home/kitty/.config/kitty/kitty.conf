font_family JetBrainsMono Nerd Font
font_size 12.0

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Transparency
background_opacity 0.85

# Padding
window_padding_width 10

# Scrollback
scrollback_lines 10000

# Smooth font rendering
enable_ligatures yes

# Colors — the Noir table: black lacquer, champagne gold, card red.
foreground #e8ddc4
background #0e0b0d

selection_foreground #0e0b0d
selection_background #d4af5f

# Cursor color
cursor #d4af5f

# The 16-color deck. Reds are card red, greens felt, yellows gold; the brights
# lean toward the chip colours.
color0  #2a2320
color1  #c13a4e
color2  #5e8d5a
color3  #d4af5f
color4  #7a89b8
color5  #a4708e
color6  #7fa08c
color7  #cfc4a8
color8  #8a7f6d
color9  #e05a6e
color10 #7fb069
color11 #f0d78c
color12 #97a7d4
color13 #c98cae
color14 #9dc0aa
color15 #e8ddc4

font_family JetBrainsMono Nerd Font
font_size 12.0

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Transparency
background_opacity 0.85

# Padding
window_padding_width 10

# Scrollback
scrollback_lines 10000

# Smooth font rendering
enable_ligatures yes

# Colors — the active table's deck, swapped by the house theme picker.
# apply-theme.sh copies house/scripts/tables/kitty-<table>.conf over this file
# and SIGUSR1s running kitties, so open terminals retint on the spot.
include current-table.conf

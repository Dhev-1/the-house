"$schema" = 'https://starship.rs/config-schema.json'

# the house — starship on the Felt table.
# The same curved powerline train as before, redealt: champagne gold into
# bronze into lacquer, a spade opening the hand and closing the prompt.

format = """
[](#c9a227)\
${custom.suit}\
$directory\
[](fg:#c9a227 bg:#2a523c)\
$git_branch\
$git_status\
[](fg:#2a523c bg:#1d4030)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:#1d4030 bg:none)\
\n$character"""

[fill]
symbol = " "
style = "bg:#1d4030"

[username]
show_always = false
format = "[ $user ](fg:#0e2b1c bg:#c9a227)"

[hostname]
ssh_only = true
format = "[@$hostname](fg:#0e2b1c bg:#c9a227)"

[directory]
style = "fg:#0e2b1c bg:#c9a227"
format = "[ $path ]($style)"
truncation_length = 0

[directory.substitutions]

[git_branch]
symbol = ""
style = "bg:#2a523c"
format = '[[ $symbol $branch ](fg:#eae3cd bg:#2a523c)]($style)'

[git_status]
style = "bg:#2a523c"
format = '[[ $all_status$ahead_behind ](fg:#c9a227 bg:#2a523c)]($style)'

[nodejs]
symbol = ""
style = "bg:#1d4030"
format = '[[ $symbol ($version) ](fg:#c9a227 bg:#1d4030)]($style)'

[rust]
symbol = ""
style = "bg:#1d4030"
format = '[[ $symbol ($version) ](fg:#c9a227 bg:#1d4030)]($style)'

[golang]
symbol = ""
style = "bg:#1d4030"
format = '[[ $symbol ($version) ](fg:#c9a227 bg:#1d4030)]($style)'

[php]
symbol = ""
style = "bg:#1d4030"
format = '[[ $symbol ($version) ](fg:#c9a227 bg:#1d4030)]($style)'

[python]
symbol = ""
style = "bg:#1d4030"
format = '[[ $symbol ($version) ](fg:#c9a227 bg:#1d4030)]($style)'

# The bet: gold when the last hand won, crimson when it lost.
[character]
success_symbol = "[❯](fg:#c9a227)"
error_symbol = "[❯](fg:#c0392f)"

[custom.suit]
command = "printf '♠\\n♥\\n♦\\n♣\\n' | shuf -n1"
when = true
shell = ["sh"]
style = "bg:#c9a227 fg:#0e2b1c"
format = "[ $output ]($style)"

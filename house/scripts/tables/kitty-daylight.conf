# kitty on the Daylight table — written by the house repo, copied to
# current-table.conf by scripts/apply-theme.sh when this table is chosen.
#
# The one light deck, and it cannot be built like the dark ones. On a light
# background lightness cannot carry the difference between colours, since every
# one has to be dark enough to read in the first place - so hue and saturation
# carry it: normals at ~4.6:1 against the background, brights at ~7.2:1, and
# saturation 52-80% throughout.
#
# color1 and color15 stay pinned to the table's urgent and text. color3 is the
# accent deepened from #9c7a1e, which only managed 3.51:1 down here. The green
# is pushed to hue 135 - kept at the table's warmer 96 it reads as olive on
# cream, and green is what says a command is valid.

foreground #46392c
background #f5efe2

selection_foreground #f5efe2
selection_background #9c7a1e

cursor #9c7a1e

color0  #e6dcc6
color1  #b3372f
color2  #0e7d2a
color3  #8a6615
color4  #336eb0
color5  #b73a89
color6  #247872
color7  #6a5d4c
color8  #776a56
color9  #942518
color10  #075c1c
color11  #654a0b
color12  #1f5088
color13  #8c2366
color14  #155853
color15  #46392c

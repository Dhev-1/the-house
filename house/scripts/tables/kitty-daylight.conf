# kitty on the Daylight table — written by the house repo, copied to
# current-table.conf by scripts/apply-theme.sh when this table is chosen.
#
# The one light deck, and it cannot be built the way the dark ones are. The
# first version was a dark palette walked downwards until it stopped glaring,
# which left every colour inside a 20-point lightness band and stripped the
# saturation on the way down - cyan came out at 13%, magenta at 21%, and a 13%
# saturated cyan is not a cyan, it is a grey. Against cream the whole deck read
# as one shade of near-black and syntax highlighting had nothing to work with.
#
# On a light background lightness cannot carry the difference, because every
# colour has to be dark enough to read in the first place. So hue and saturation
# carry it instead: the normals sit at ~4.6:1 against the background, the
# brights at ~7.2:1, and saturation runs 52-80% throughout rather than 13-68%.
#
# color1 and color15 stay pinned to the table's own urgent and text, so the
# terminal's red is the house red. color3 is the accent deepened from #9c7a1e,
# which is right in the bar but only managed 3.51:1 down here.
#
# The green is the one colour that does not follow the table's warmth. Kept warm
# it sits around hue 96, and a yellow-green on cream is an olive however much
# saturation it is given - which matters because green is what says a command is
# valid. At hue 135 it reads as green at a glance, which is the whole job.

foreground #46392c
background #f5efe2

selection_foreground #f5efe2
selection_background #9c7a1e

cursor #9c7a1e

color0  #e6dcc6
color1  #b3372f
color2  #0e7d2a
color3  #8a6615
color4  #336eb0
color5  #b73a89
color6  #247872

# kitty on the Felt table — written by the house repo, copied to
# current-table.conf by scripts/apply-theme.sh when this table is chosen.
#
# color8 (dim text: comments, timestamps) is a warm grey rather than the muted
# green it started as. On baize a green-grey sat at 3.21:1 against the
# background and was near enough to color6 to be the same swatch; warm gives it
# both the contrast and somewhere to be that the cyan is not.

